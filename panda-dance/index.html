<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#30214f"><title>판다 댄스파티 🐼</title><style>
*{box-sizing:border-box}body{margin:0;color:#fff9ff;background:#17132c;font-family:ui-rounded,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}button{font:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}#game{max-width:660px;margin:0 auto;padding:12px 12px calc(18px + env(safe-area-inset-bottom));background:radial-gradient(circle at top,#49366d,#1a142f 70%);min-height:100vh}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}h1{font-size:clamp(20px,5vw,30px);line-height:1.05;margin:0;letter-spacing:-.8px}.subtitle{font-size:11px;color:#e3c9f3;margin:6px 0 0}.sound{background:#39305a;color:#fff;border:1px solid #6b5a8e;border-radius:13px;padding:10px 12px;white-space:nowrap;font-size:12px;font-weight:800;min-height:42px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.stat{border:1px solid #80639d;background:#35264f;border-radius:13px;padding:8px 10px}.stat small{display:block;color:#ddc5ed;font-size:10px}.stat strong{font-size:20px;color:#ffe39b;font-variant-numeric:tabular-nums}.stat:nth-child(2) strong{color:#ff9ece}.stat:nth-child(3) strong{color:#adffe3}.stage{height:315px;position:relative;overflow:hidden;border-radius:23px;background:radial-gradient(ellipse at 50% 42%,#7351a7 0%,#46306e 45%,#211a42 100%);border:2px solid #9274bd;box-shadow:inset 0 -20px 70px #13102544}.stage:before{content:'✧　　 ✦　　 ✧　　✧　　　✦　✧';position:absolute;inset:28px 0 auto;text-align:center;color:#ecd5ff88;font-size:22px;letter-spacing:11px;pointer-events:none}.stage:after{content:'';position:absolute;bottom:-24px;left:-12%;width:124%;height:89px;border-radius:50%;background:radial-gradient(ellipse,#e08bf288 0,#8c5cc144 49%,transparent 70%)}.lights{position:absolute;left:0;right:0;top:-30px;height:230px;z-index:0;pointer-events:none}.beam{position:absolute;top:0;width:38%;height:100%;background:linear-gradient(#fac4fb6a,transparent);clip-path:polygon(47% 0,53% 0,100% 100%,0 100%);animation:sway 3s ease-in-out infinite alternate;transform-origin:top}.beam.a{left:6%}.beam.b{right:6%;animation-direction:alternate-reverse;background:linear-gradient(#b0e6ff77,transparent)}@keyframes sway{to{transform:rotate(18deg)}}.disc{position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-size:47px;z-index:1;filter:drop-shadow(0 2px 6px #e9a9ff)}.bubble{position:absolute;top:52px;left:50%;transform:translateX(-50%);white-space:nowrap;z-index:7;color:#543264;background:#fff6fc;border:3px solid #ffd6f5;border-radius:17px;padding:8px 14px;font-size:15px;font-weight:900;max-width:94%;box-shadow:0 5px 0 #1f153749}.bubble:after{content:'';position:absolute;bottom:-10px;left:47%;height:14px;width:14px;background:#fff6fc;transform:rotate(45deg);border-bottom:3px solid #ffd6f5;border-right:3px solid #ffd6f5}.bubble.pop{animation:pop .25s ease-out}@keyframes pop{from{transform:translateX(-50%) scale(.8)}to{transform:translateX(-50%) scale(1)}}.panda{position:absolute;z-index:5;left:50%;bottom:10px;width:205px;height:228px;transform:translateX(-50%);filter:drop-shadow(0 12px 2px #1b143846)}.panda svg{width:100%;height:100%;overflow:visible}.panda .arm-l,.panda .arm-r,.panda .head{transform-box:fill-box}.panda .arm-l{transform-origin:75% 14%;animation:arm1 1.1s infinite alternate}.panda .arm-r{transform-origin:25% 14%;animation:arm2 1.1s infinite alternate}.panda .head{transform-origin:50% 75%;animation:nod 1.4s infinite alternate}@keyframes arm1{to{transform:rotate(-16deg)}}@keyframes arm2{to{transform:rotate(16deg)}}@keyframes nod{to{transform:rotate(5deg)}}.panda.jump{animation:jump .68s ease-in-out 2}.panda.spin{animation:spin 1s ease-in-out}.panda.wiggle{animation:wiggle .22s ease-in-out 7}.panda.slide{animation:slide 1.2s ease-in-out}.panda.heart{animation:heart .35s ease-in-out 4}.panda.robot{animation:robot .22s steps(2,end) 7}.panda.jump .arm-l,.panda.heart .arm-l,.panda.spin .arm-l{animation:up-l .25s alternate infinite}.panda.jump .arm-r,.panda.heart .arm-r,.panda.spin .arm-r{animation:up-r .25s alternate infinite}@keyframes up-l{to{transform:rotate(-100deg)}}@keyframes up-r{to{transform:rotate(100deg)}}@keyframes jump{0%,100%{transform:translateX(-50%) translateY(0)}45%{transform:translateX(-50%) translateY(-48px)}75%{transform:translateX(-50%) translateY(0)}}@keyframes spin{to{transform:translateX(-50%) rotate(360deg)}}@keyframes wiggle{0%,100%{transform:translateX(-50%) rotate(-12deg)}50%{transform:translateX(-50%) rotate(12deg)}}@keyframes slide{0%,100%{transform:translateX(-50%)}30%{transform:translateX(calc(-50% - 65px)) rotate(-12deg)}65%{transform:translateX(calc(-50% + 65px)) rotate(12deg)}}@keyframes heart{50%{transform:translateX(-50%) scale(1.14)}}@keyframes robot{50%{transform:translateX(calc(-50% + 10px)) translateY(-8px) rotate(9deg)}}.particle{position:absolute;z-index:9;top:54%;left:50%;pointer-events:none;font-size:25px;animation:burst .95s ease-out forwards}@keyframes burst{0%{opacity:1;transform:translate(-50%,-50%) scale(.6)}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1.35) rotate(40deg)}}.stage.fever{animation:rainbow .9s linear infinite alternate}.fevertext{position:absolute;z-index:6;top:12px;left:12px;background:#ff75bd;border-radius:12px;padding:8px 11px;font-size:12px;font-weight:900;display:none}.fever .fevertext{display:block}@keyframes rainbow{to{filter:hue-rotate(70deg)}}.time{position:absolute;top:12px;right:12px;font-size:11px;border-radius:13px;background:#241a4dc5;padding:7px 10px;z-index:6}.meter{display:flex;align-items:center;gap:10px;margin:11px 1px 0}.meter span{font-size:11px;font-weight:800;white-space:nowrap;color:#ffdf99}.track{flex:1;height:10px;background:#382a56;border:1px solid #795f91;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#ff7ab5,#ffcd73);transition:width .2s}.mission{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0;padding:10px 13px;background:#3c2c5a;border:1px solid #8066a2;border-radius:14px;font-weight:800;font-size:12px}.mission b{color:#ffd67c}.heading{font-size:15px;font-weight:900;margin:12px 0 9px}.moves{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.move{border:1px solid #aa7ed5;border-radius:16px;min-height:66px;background:linear-gradient(145deg,#694b91,#40305f);color:#fff;display:flex;align-items:center;text-align:left;gap:10px;padding:10px 12px;box-shadow:0 4px 0 #201735;transition:transform .08s}.move:active{transform:translateY(3px);box-shadow:0 1px 0 #201735}.move .emoji{font-size:29px;width:36px;text-align:center}.move b{display:block;font-size:14px}.move small{display:block;color:#ebd0fa;font-size:10px;margin-top:2px}.bottom{display:flex;gap:9px;margin-top:14px}.start{flex:1;background:linear-gradient(115deg,#ff88b7,#ffcf76);color:#3e2850;font-size:14px;font-weight:950;border:none;border-radius:14px;padding:13px 12px;box-shadow:0 4px 0 #ad547e}.reset{padding:12px;border:1px solid #866cab;background:#3e315d;color:#fff;border-radius:14px;font-size:12px;font-weight:800}.tip{font-size:10px;color:#beacd1;text-align:center;margin:11px 0 0}.overlay{position:absolute;inset:0;z-index:20;background:#22163fda;display:none;align-items:center;justify-content:center;padding:18px}.overlay.open{display:flex}.result{background:#fff4ff;color:#49305e;border-radius:23px;padding:27px 20px;text-align:center;width:100%;max-width:300px;box-shadow:0 14px 0 #2d1d4c}.result h2{margin:10px 0}.result .big{font-size:40px;font-weight:1000;color:#ec679b}.result button{margin-top:12px;border:0;border-radius:14px;background:#ff9ec6;color:#4d2853;padding:14px 20px;font-weight:950}.result p{font-size:13px;margin:8px 0}@media(min-width:550px){#game{padding:20px}.stage{height:360px}.panda{width:250px;height:278px}.moves{grid-template-columns:repeat(3,1fr)}}@media(max-width:355px){.move{padding:8px;gap:6px}.move b{font-size:12px}.move .emoji{width:30px;font-size:24px}.bubble{font-size:13px}}
</style></head><body><div id="game"><header class="top"><div><h1>🐼 판다 댄스파티</h1><p class="subtitle">버튼을 누르면 판다가 신나게 춤춰요!</p></div><button class="sound" id="sound" aria-pressed="false">🔇 음악 OFF</button></header><div class="stats"><div class="stat"><small>⭐ 점수</small><strong id="score">0</strong></div><div class="stat"><small>💖 콤보</small><strong id="combo">0</strong></div><div class="stat"><small>🏆 최고 콤보</small><strong id="best">0</strong></div></div><main><section class="stage" id="stage" aria-label="춤추는 판다 무대"><div class="lights"><div class="beam a"></div><div class="beam b"></div></div><div class="disc" aria-hidden="true">🪩</div><div class="time" id="time">♾️ 자유 놀이</div><div class="fevertext">🔥 FEVER! 점수 2배</div><div class="bubble" id="bubble" role="status">어떤 춤을 출까? 🎶</div><div class="panda" id="panda"><svg viewBox="0 0 240 265" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><ellipse cx="120" cy="250" rx="76" ry="12" fill="#1b153c" opacity=".3"/><ellipse cx="81" cy="226" rx="28" ry="27" fill="#302c3f"/><ellipse cx="160" cy="226" rx="28" ry="27" fill="#302c3f"/><g class="arm-l"><ellipse cx="57" cy="170" rx="24" ry="43" fill="#302c3f" transform="rotate(27 57 170)"/></g><g class="arm-r"><ellipse cx="183" cy="170" rx="24" ry="43" fill="#302c3f" transform="rotate(-27 183 170)"/></g><ellipse cx="120" cy="190" rx="61" ry="65" fill="#302c3f"/><ellipse cx="120" cy="191" rx="42" ry="50" fill="#fffaf4"/><path d="M120 167l6 13 14 2-10 10 2 14-12-7-12 7 2-14-10-10 14-2z" fill="#ffb764"/><g class="head"><ellipse cx="68" cy="51" rx="29" ry="34" fill="#302c3f" transform="rotate(-25 68 51)"/><ellipse cx="172" cy="51" rx="29" ry="34" fill="#302c3f" transform="rotate(25 172 51)"/><ellipse cx="68" cy="52" rx="15" ry="19" fill="#ff9ec6" transform="rotate(-25 68 52)"/><ellipse cx="172" cy="52" rx="15" ry="19" fill="#ff9ec6" transform="rotate(25 172 52)"/><ellipse cx="120" cy="109" rx="76" ry="73" fill="#fffaf4" stroke="#f2e7ed" stroke-width="3"/><ellipse cx="93" cy="106" rx="23" ry="31" fill="#302c3f" transform="rotate(20 93 106)"/><ellipse cx="147" cy="106" rx="23" ry="31" fill="#302c3f" transform="rotate(-20 147 106)"/><ellipse cx="98" cy="102" rx="7" ry="10" fill="#fff"/><ellipse cx="142" cy="102" rx="7" ry="10" fill="#fff"/><ellipse cx="101" cy="99" rx="2.7" ry="4" fill="#302c3f"/><ellipse cx="139" cy="99" rx="2.7" ry="4" fill="#302c3f"/><ellipse cx="78" cy="133" rx="13" ry="7" fill="#ffb6c9"/><ellipse cx="162" cy="133" rx="13" ry="7" fill="#ffb6c9"/><path d="M108 126q12 -10 24 0q-3 12-12 12q-9 0-12-12" fill="#302c3f"/><path d="M120 138v6m0 0q-8 9-15 1m15-1q8 9 15 1" fill="none" stroke="#302c3f" stroke-width="3.5" stroke-linecap="round"/><path d="M56 86q3 -48 64 -49q61 1 64 49" fill="none" stroke="#ff9ccd" stroke-width="12"/><rect x="48" y="84" width="19" height="40" rx="9" fill="#e960ad" stroke="#ffd0e7" stroke-width="3"/><rect x="173" y="84" width="19" height="40" rx="9" fill="#e960ad" stroke="#ffd0e7" stroke-width="3"/></g></svg></div><div class="overlay" id="overlay"><div class="result"><div style="font-size:44px">🏆🐼🎉</div><h2>댄스 스타 탄생!</h2><p>30초 동안 모은 점수</p><div class="big" id="finalScore">0점</div><button id="again">한 번 더! 💃</button></div></div></section><div class="meter"><span>🔥 피버 게이지</span><div class="track"><div class="fill" id="fill"></div></div><span id="percent">0%</span></div><div class="mission"><span id="mission">🎯 오늘의 미션: 점프 3번!</span><b id="progress">0/3</b></div><div class="heading">👇 판다에게 춤을 시켜봐요!</div><div class="moves"><button class="move" data-move="jump"><span class="emoji">🐾</span><span><b>깡총 점프</b><small>폴짝폴짝!</small></span></button><button class="move" data-move="spin"><span class="emoji">🌀</span><span><b>빙글 회전</b><small>빙그르르!</small></span></button><button class="move" data-move="wiggle"><span class="emoji">🎵</span><span><b>둠칫 댄스</b><small>흔들흔들!</small></span></button><button class="move" data-move="slide"><span class="emoji">⚡</span><span><b>슝 슬라이드</b><small>왼쪽 오른쪽!</small></span></button><button class="move" data-move="heart"><span class="emoji">💗</span><span><b>하트 뿅!</b><small>사랑해!</small></span></button><button class="move" data-move="robot"><span class="emoji">🤖</span><span><b>로봇 춤</b><small>삐빅 삐빅!</small></span></button></div><div class="bottom"><button class="start" id="challenge">⏱️ 30초 도전 시작!</button><button class="reset" id="reset">↺ 점수 초기화</button></div><p class="tip">춤 버튼을 연속으로 누르면 콤보가 올라가요! · 음악은 선택사항</p></main></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id),panda=$('panda'),stage=$('stage'),bubble=$('bubble');const moves={jump:['깡총! 하늘까지! 🐾','⭐'],spin:['빙그르르~ 어지러워! 🌀','✨'],wiggle:['둠칫둠칫! 🎶','🎵'],slide:['슈웅! 슈퍼 판다! ⚡','💫'],heart:['사랑해! 뿅! 💗','💖'],robot:['삐빅! 나는 로봇! 🤖','⚙️']};let score=0,combo=0,best=0,energy=0,fever=false,feverTimer=0,last=0,challenge=false,left=30,clock=0,mission='jump',missionCount=0,missionIndex=0,soundOn=false,ctx=null,beat=0,musicClock=0;const keys=Object.keys(moves);try{best=Number(localStorage.getItem('panda-best-combo')||0)}catch(e){}function update(){ $('score').textContent=score;$('combo').textContent=combo;$('best').textContent=best;$('fill').style.width=energy+'%';$('percent').textContent=energy+'%';$('progress').textContent=missionCount+'/3';$('mission').textContent='🎯 미션: '+({jump:'깡총 점프',spin:'빙글 회전',wiggle:'둠칫 댄스',slide:'슝 슬라이드',heart:'하트 뿅!',robot:'로봇 춤'})[mission]+' 3번!';}function say(s){bubble.textContent=s;bubble.classList.remove('pop');void bubble.offsetWidth;bubble.classList.add('pop')}function sparkle(symbol){for(let i=0;i<9;i++){const el=document.createElement('span');el.className='particle';el.textContent=symbol;el.style.setProperty('--x',(Math.random()*240-120)+'px');el.style.setProperty('--y',(Math.random()*-190+42)+'px');el.style.left=(48+Math.random()*5)+'%';stage.appendChild(el);setTimeout(()=>el.remove(),1000)}}function tone(freq,dur=.1,vol=.08){if(!soundOn)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();let o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(vol,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+dur);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+dur)}catch(e){}}function play(move){if(!moves[move]||$('overlay').classList.contains('open'))return;const now=Date.now();combo=now-last<3000?combo+1:1;last=now;best=Math.max(best,combo);try{localStorage.setItem('panda-best-combo',best)}catch(e){}score+=(10+Math.min(combo,15))*(fever?2:1);if(!fever){energy=Math.min(100,energy+15);if(energy>=100){fever=true;energy=0;stage.classList.add('fever');say('🔥 피버 타임! 점수 2배!');sparkle('🌟');clearTimeout(feverTimer);feverTimer=setTimeout(()=>{fever=false;stage.classList.remove('fever');say('우와! 다시 춤춰볼까?')},6500)}}panda.className='panda';void panda.offsetWidth;panda.classList.add(move);if(!fever)say(moves[move][0]);sparkle(moves[move][1]);tone(320+(keys.indexOf(move)*80),.13);if(mission===move){missionCount++;if(missionCount===3){score+=50;say('🎉 미션 성공! +50점');sparkle('🌈');missionIndex=(missionIndex+1)%keys.length;mission=keys[(missionIndex+2)%keys.length];missionCount=0}}update()}document.querySelectorAll('[data-move]').forEach(b=>b.addEventListener('click',()=>play(b.dataset.move)));function stopChallenge(show){clearInterval(clock);challenge=false;left=30;$('time').textContent='♾️ 자유 놀이';$('challenge').textContent='⏱️ 30초 도전 시작!';if(show){$('finalScore').textContent=score+'점';$('overlay').classList.add('open');say('최고야! 또 놀자! 🎉')}}function startChallenge(){stopChallenge(false);$('overlay').classList.remove('open');reset(false);challenge=true;left=30;$('time').textContent='⏱️ '+left+'초 남음';$('challenge').textContent='⏹ 도전 그만하기';clock=setInterval(()=>{left--;if(left<=0){stopChallenge(true)}else{$('time').textContent='⏱️ '+left+'초 남음'}},1000);say('30초 댄스 시작! 🎉')}function reset(message=true){score=0;combo=0;energy=0;last=0;fever=false;clearTimeout(feverTimer);stage.classList.remove('fever');mission='jump';missionIndex=0;missionCount=0;update();if(message)say('다시 시작! 어떤 춤을 출까? 🐼')}$('challenge').addEventListener('click',()=>challenge?stopChallenge(false):startChallenge());$('reset').addEventListener('click',()=>{stopChallenge(false);$('overlay').classList.remove('open');reset()});$('again').addEventListener('click',startChallenge);$('sound').addEventListener('click',()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊 음악 ON':'🔇 음악 OFF';$('sound').setAttribute('aria-pressed',String(soundOn));if(soundOn){tone(520,.16);clearInterval(musicClock);musicClock=setInterval(()=>{if(soundOn){tone([262,330,392,523,392,330,294,349][beat++%8],.17,.018)}},260)}else{clearInterval(musicClock)}});document.addEventListener('keydown',e=>{if(/^[1-6]$/.test(e.key)&&!e.repeat)play(keys[Number(e.key)-1])});update()})();
</script></body></html>
